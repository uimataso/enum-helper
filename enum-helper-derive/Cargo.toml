[package]
name = "enum-helper-derive"
version = "0.1.0"
authors = ["uima <git@uimataso.com>"]
edition = "2024"
rust-version = "1.85"
description = "Procedural macro implementation for enum-helper"
documentation = "https://docs.rs/enum-helper"
readme = "../README.md"
repository = "https://github.com/uimataso/enum-helper"
license = "MIT OR Apache-2.0"
keywords = ["enum", "macros", "proc-macros", "derive"]
categories = ["development-tools::procedural-macro-helpers"]

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = "2"

[dev-dependencies]
assert2 = "0.4"
enum-helper = { path = "../enum-helper" }
